[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-rlm"
version = "0.1.0"
description = "A recursive language model with OpenRouter and Jev decision primitives"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "openai",
    "requests",
    "python-dotenv",
    "rich",
]

[tool.setuptools.packages.find]
include = ["rlm*"]
